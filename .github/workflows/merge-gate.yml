# 合并门禁 —— 草稿，尚未生效
#
# ⚠ 生效前必须做三件事，缺一这份配置就只是装饰：
#   1. 把 CODEOWNERS 里的 @qa-owners / @qa-leads 换成真实用户或团队
#   2. 在平台上开启受保护分支，并把本 workflow 的 job 设为 required check
#   3. 在平台上开启"新 commit 使已有审批失效"（dismiss stale reviews）
#
# 为什么这些是前提：Task 0 item 5 已实测确认 shell 子进程的文件写入绕过 Kiro 的能力层，
# 所以任何"靠权限规则保护产物"的说法都不成立。真正的强制点只有受保护分支 + CODEOWNERS
# 审批 + 本 workflow 从可信执行的原始产物重新生成门禁输入。详见 docs/protected-paths.md。

name: merge-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. 自检层：结构校验 + 脚本单测。这一层证明"判定器本身没坏"。
  # ---------------------------------------------------------------------------
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gate 需要 target_sha 与差异范围

      - name: 装 Python 与依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装依赖（版本锁定，无 fallback）
        run: pip install -r requirements-ci.txt
        # 原先这里有 `|| pip install pyyaml pytest` 的 fallback，会拉未锁定版本 ——
        # 判定器的运行环境每次都可能不同，门禁结论就失去可复现性，已删除。
        # requirements-ci.txt 目前只锁版本号、**未锁哈希**，补齐方式见该文件注释。

      - name: 结构校验
        run: python3 scripts/validate_spec.py --root .

      - name: 角色配置校验
        run: python3 scripts/validate_agents.py --root .

      - name: 判定器单测
        run: python3 -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  # 2. 执行层：跑被测项目的测试，产出**框架原生报告**。
  #    关键约束：这一步的产物是机器产出，agent 不可写；下游只认这里的原始报告。
  # ---------------------------------------------------------------------------
  run-tests:
    runs-on: ubuntu-latest
    needs: self-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # TODO(待用户输入): 这一段依赖 v1 真实接口场景仓库。
      #   需要知道：测试框架、启动命令、原生报告格式（JUnit XML / json-report / ...）。
      #   在此之前无法写出真实的执行步骤。
      - name: 收集可执行测试（产出 collect 清单）
        run: |
          echo "TODO: 替换为真实框架的 collect 命令，例如"
          echo "  pytest --collect-only -q --json-report --json-report-file=collected.raw.json"
          echo "然后转换为 qa/trace/<feature>/collected.json 的格式"
          exit 1

      - name: 执行测试（产出原生报告）
        run: |
          echo "TODO: 替换为真实框架的执行命令，例如"
          echo "  pytest --junitxml=qa/runs/$RUN_ID/raw/junit.xml"
          exit 1

      - name: 上传原始产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-artifacts
          path: qa/runs/*/raw/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. 判定层：**从原始产物重新生成**门禁输入，再判定。
  #    不消费候选分支工作副本里的 run.json —— 那份可被候选任意改动。
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()               # 执行失败也要出结论（应为 INCOMPLETE 或 FAIL）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-ci.txt

      - name: 下载原始产物（落到专属空目录，避免与候选 checkout 混淆）
        uses: actions/download-artifact@v4
        continue-on-error: true    # 产物缺失本身就是证据不完整 → INCOMPLETE
        with:
          name: raw-test-artifacts
          # 刻意不下到 qa/runs/：候选 checkout 里可能自带 qa/runs/*/raw，
          # 混在一起就分不清哪份是可信执行产出的。
          path: ci-artifacts/raw

      - name: 组装可信判定树（受保护的规则与基线 + 候选的用例与重建产物）
        run: |
          set -euo pipefail
          # 规则、重试策略、review_mode、需求基线必须取 **target_sha 上已批准的版本**，
          # 不能用候选分支里的版本 —— 否则候选可以用自带的新规则或改小的分母给自己放行。
          #
          # 上一版只把它们导出到 .gate-policy，但 trace/gate 仍用 --root . 跑，
          # 读的还是候选 checkout 里的 qa/baseline 与 qa/plan：导出了却没消费，
          # "可信脚本"不等于"可信规则与分母已生效"。现在组装一棵判定树并用它当 --root。
          TARGET_SHA=$(git rev-parse "origin/${{ github.base_ref }}")
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

          rm -rf .gate-root
          mkdir -p .gate-root
          # 受保护侧：判定脚本 + 门禁规则 + 需求基线
          git archive "$TARGET_SHA" scripts qa/plan qa/baseline | tar -x -C .gate-root
          # 候选侧：用例（qa-design 的产出，本就属于候选变更）
          if [ -d qa/cases ]; then
            mkdir -p .gate-root/qa
            cp -R qa/cases .gate-root/qa/
          fi
          # 候选侧：collect 清单（由可信执行层产出，随原始产物一起来更好；
          # 暂无独立产物时退回候选副本，并在报告里以 automation_evidence 体现来源风险）
          if [ -d qa/trace ]; then
            cp -R qa/trace .gate-root/qa/ || true
          fi

          POLICY_VERSION=$(git rev-parse "$TARGET_SHA:qa/plan")
          echo "POLICY_VERSION=$POLICY_VERSION" >> "$GITHUB_ENV"
          echo "GATE_ROOT=.gate-root" >> "$GITHUB_ENV"

      - name: 从原始产物重建门禁输入
        id: rebuild
        continue-on-error: true    # 失败也要让后面的门禁步骤产出 INCOMPLETE 报告
        run: |
          set -euo pipefail
          # 重建脚本已实现（scripts/rebuild_run_json.py，受保护路径：改它等于改证据来源）。
          # 用可信判定树里那一份，不用候选工作副本里的版本。
          RUN_ID="${CANDIDATE_SHA:0:12}"

          # 多份分片全部传入：上一版 `find ... | head -1` 只取一份目录，
          # 分片一多就会静默漏掉一部分结果。
          RAW_ARGS=()
          while IFS= read -r d; do
            RAW_ARGS+=(--raw "$d")
          done < <(find ci-artifacts/raw -type d -name raw 2>/dev/null || true)
          if [ ${#RAW_ARGS[@]} -eq 0 ] && [ -d ci-artifacts/raw ]; then
            RAW_ARGS+=(--raw ci-artifacts/raw)
          fi
          if [ ${#RAW_ARGS[@]} -eq 0 ]; then
            echo "原始产物缺失 → 证据不完整。门禁会判 INCOMPLETE。" >&2
            echo "不要用候选分支里的 run.json 补位。" >&2
            exit 1
          fi

          # 需求基线必须是**受保护分支上已确认且有效**的那一份。
          # 上一版用 `git cat-file -e $TARGET_SHA:qa/baseline` 判目录存在 ——
          # 只有 .gitkeep 的目录同样存在，等于把"没有基线"当成"有基线"。
          BASELINE_FILE=$(find .gate-root/qa/baseline -name requirements.yaml \
            -type f 2>/dev/null | head -1 || true)
          if [ -z "$BASELINE_FILE" ]; then
            echo "受保护分支上没有有效的 requirements.yaml → 覆盖率无分母。" >&2
            echo "这是待交付的数据缺口（需求基线由人维护），不是脚本缺失。" >&2
            exit 1
          fi

          mkdir -p ".gate-root/qa/runs/$RUN_ID"
          # baseline_version / baseline_hash 由 --baseline-file 推出：
          # 算法复用 trace_matrix.compute_baseline_hash。上一版在这里用 git tree SHA
          # 和"文件哈希清单的哈希"，与消费者的 meta.baseline_version 和
          # 规范化内容 sha256 是两套契约，有真实基线也对不上。
          python3 .gate-root/scripts/rebuild_run_json.py \
            "${RAW_ARGS[@]}" \
            --out ".gate-root/qa/runs/$RUN_ID/run.json" \
            --run-id "$RUN_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --target-sha "$TARGET_SHA" \
            --policy-version "$POLICY_VERSION" \
            --baseline-file "$BASELINE_FILE" \
            --node-id-strategy "${QA_NODE_ID_STRATEGY:-pytest}"

      - name: 追溯与覆盖
        if: always()
        run: |
          python3 .gate-root/scripts/trace_matrix.py --root .gate-root --fail-on-gap || true
          # 这里不 fail，缺口由 gate_check 汇总成三态结论，避免两处各判一半

      - name: 门槛变化扫描（提示，非结论）
        if: always()
        run: |
          set -euo pipefail
          git diff "origin/${{ github.base_ref }}...HEAD" > candidate.diff
          python3 .gate-root/scripts/guard_scan.py \
            --root . --diff-file candidate.diff --with-waivers

      - name: 合并门禁判定
        id: gate
        if: always()               # 上游失败也要产出结论报告（应为 INCOMPLETE）
        run: |
          set -euo pipefail
          # TODO(待用户输入): review_mode 取 manual 还是 automated_required，
          #   取决于 CI 里能否跑 agent。它写在受保护的 required-scope.yaml 里，
          #   此处不传参、不覆盖 —— 模式必须预先固定，不得在评审失败后临时切换。
          #
          # TODO(待用户输入): --human-approval-ref 需从平台审批记录 API 取，
          #   不读仓库内文件。manual 模式下缺它一律 INCOMPLETE。
          python3 .gate-root/scripts/gate_check.py \
            --root .gate-root \
            --candidate-sha "$CANDIDATE_SHA" \
            --target-sha "$TARGET_SHA" \
            --policy-version "$POLICY_VERSION" \
            --diff-file candidate.diff \
            --out qa/reports/merge-gate-report.json

      - name: 上传门禁报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-report
          path: |
            qa/reports/merge-gate-report.json
            candidate.diff
          retention-days: 90

# ---------------------------------------------------------------------------
# 尚未落地的部分（不要当成已实现）
# ---------------------------------------------------------------------------
#
# · 本 workflow 从未在远端实际运行过（当前提交的 Actions runs 为 0）。下面写的是
#   静态调用链上已修正的问题，**不等于**端到端跑通过。首次真实运行前不要宣称链路完成。
#
# · 「从原始产物重建门禁输入」**已实现**：scripts/rebuild_run_json.py
#   （JUnit XML → run.json，六字段版本绑定缺一即拒，脱敏 + 截断，
#   解析失败或无 attempt 标记 incomplete）。该步骤现在失败只会因为两种**数据**原因：
#   没有原始产物、或受保护分支上没有 qa/baseline。两者都应当导致 INCOMPLETE。
#
# · run-tests 的 collect / 执行两步仍是 `exit 1` 占位，且是**真正的待输入**：
#   需要被测项目的框架、启动命令与原生报告格式。填之前这份 workflow 会失败，
#   这是故意的 —— 一个"能跑过但什么都没验证"的门禁比没有门禁更危险。
#
# · 未支持的原生报告格式：JSON report / TRX / TAP。遇到时应扩展 rebuild_run_json.py
#   并补测试，**不要**在 CI 里临时转换 —— 临时脚本不在受保护路径内，
#   等于把证据来源搬到了不受保护的地方。
#
# · 评审链路（review-verdict.json 由 CI 评审执行器产出）没有写在这里，
#   因为它依赖"CI 能否跑 agent"的答案。若不能，review_mode 保持 manual，
#   阻断完全依赖平台人工审批记录，报告里会注明"未运行自动评审"。
#
# · requirements-ci.txt 的哈希锁定未生成，当前 fallback 会拉未锁定版本。
#
# · 本地 `make gate` 与这份 workflow 的区别：本地读工作副本，可被候选任意改动，
#   仅供自检；合并门禁只认这里从原始产物重新生成的那份。
